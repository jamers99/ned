name: CI

# Pull requests run the tests. A push to main runs them too and, if they pass, deploys.
# The database is Neon Postgres: https://console.neon.tech/app/org-wandering-rain-03820999/
# Its connection string lives in the app's settings on Azure (set by setup.sh), not in GitHub.
on:
  push:
    branches: [main]
  pull_request:

concurrency: ${{ github.ref }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign in to Azure; only main is trusted there
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Client tests
        working-directory: client
        run: npm ci && npm run check && npm test
      - name: Screen tests
        working-directory: client
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Import tests
        run: node --test tools/nara-import/nara.test.ts
      - name: Server tests
        run: dotnet test server/Ned.slnx

      - if: github.event_name == 'push'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: github.event_name == 'push'
        run: ./deploy.sh
